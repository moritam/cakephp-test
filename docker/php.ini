; 本番用の PHP 設定 (php.ini-production に上書き)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
date.timezone = UTC

; セッションはコンテナを作り直しても消えないよう、ボリューム (/data) に保存する
session.save_path = /data/sessions
session.gc_probability = 1
session.gc_divisor = 100

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
; イメージ内のコードは変わらないのでタイムスタンプを確認しない
opcache.validate_timestamps = 0
